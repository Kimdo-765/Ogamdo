[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-rag"
version = "0.1.0"
description = "Portable, evidence-backed security research retrieval"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
security-rag = "security_rag.__main__:main"

[tool.setuptools.packages.find]
include = ["security_rag*"]
